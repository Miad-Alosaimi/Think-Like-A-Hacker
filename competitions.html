<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competitions - Event Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-dark: #0a0e27;
            --accent-cyan: #00d9ff;
            --accent-green: #00ff88;
            --accent-red: #ff1744;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --border-color: rgba(0, 217, 255, 0.2);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary-dark) 0%, #0f1535 50%, #0a0e27 100%);
            color: var(--text-primary);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .page-header {
            margin-bottom: 40px;
            text-align: center;
        }

        .page-header h1 {
            font-size: 42px;
            color: var(--accent-cyan);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .page-header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .competitions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .competition-card {
            background: rgba(26, 41, 66, 0.6);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .competition-card:hover {
            border-color: var(--accent-cyan);
            background: rgba(26, 41, 66, 0.8);
            box-shadow: 0 5px 20px rgba(0, 217, 255, 0.2);
        }

        .comp-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .comp-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .comp-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .comp-status.active {
            background: rgba(0, 255, 136, 0.2);
            color: var(--accent-green);
            border: 1px solid rgba(0, 255, 136, 0.4);
        }

        .comp-status.finished {
            background: rgba(255, 23, 68, 0.2);
            color: var(--accent-red);
            border: 1px solid rgba(255, 23, 68, 0.4);
        }

        .comp-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
            font-size: 12px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
        }

        .info-label {
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .info-value {
            color: var(--accent-cyan);
            font-family: 'Courier New', monospace;
            word-break: break-all;
            max-width: 250px;
        }

        .comp-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }

        .action-btn {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            background: rgba(0, 217, 255, 0.1);
            color: var(--accent-cyan);
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: rgba(0, 217, 255, 0.2);
            border-color: var(--accent-cyan);
        }

        .action-btn.danger {
            background: rgba(255, 23, 68, 0.1);
            color: var(--accent-red);
            border-color: rgba(255, 23, 68, 0.3);
        }

        .action-btn.danger:hover {
            background: rgba(255, 23, 68, 0.2);
            border-color: var(--accent-red);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state p {
            font-size: 16px;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .competitions-grid {
                grid-template-columns: 1fr;
            }

            .comp-actions {
                grid-template-columns: 1fr;
            }
        }

        /* SIDEBAR NAVIGATION */
        .sidebar {
            position: fixed;
            left: -280px;
            top: 0;
            width: 280px;
            height: 100vh;
            background: rgba(26, 41, 66, 0.95);
            border-right: 2px solid var(--border-color);
            padding: 20px;
            overflow-y: auto;
            transition: left 0.3s ease;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-title {
            font-size: 16px;
            color: var(--accent-cyan);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sidebar-close {
            background: none;
            border: none;
            color: var(--accent-cyan);
            font-size: 24px;
            cursor: pointer;
            padding: 0;
        }

        .sidebar-account {
            background: rgba(0, 217, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 30px;
        }

        .account-label {
            font-size: 11px;
            color: var(--accent-green);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .account-name {
            font-size: 14px;
            color: var(--accent-cyan);
            word-break: break-all;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-link {
            display: block;
            padding: 12px 15px;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .sidebar-link:hover {
            background: rgba(0, 217, 255, 0.1);
            color: var(--accent-cyan);
            border-left-color: var(--accent-cyan);
        }

        .sidebar-link.active {
            background: rgba(0, 217, 255, 0.2);
            color: var(--accent-cyan);
            border-left-color: var(--accent-cyan);
        }

        .sidebar-divider {
            height: 1px;
            background: var(--border-color);
            margin: 20px 0;
        }

        .sidebar-logout {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
        }

        .logout-btn {
            width: calc(100% - 40px);
            padding: 12px;
            background: rgba(255, 23, 68, 0.1);
            border: 1px solid rgba(255, 23, 68, 0.3);
            color: var(--accent-red);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .logout-btn:hover {
            background: rgba(255, 23, 68, 0.2);
        }

        .hamburger {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            background: rgba(0, 217, 255, 0.1);
            border: 1px solid rgba(0, 217, 255, 0.3);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            transition: all 0.3s ease;
            z-index: 999;
        }

        .hamburger:hover {
            background: rgba(0, 217, 255, 0.2);
            border-color: var(--accent-cyan);
        }

        .hamburger span {
            width: 20px;
            height: 2px;
            background: var(--accent-cyan);
            border-radius: 2px;
        }

        .hamburger.open span:nth-child(1) {
            transform: rotate(45deg) translateY(10px);
        }

        .hamburger.open span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.open span:nth-child(3) {
            transform: rotate(-45deg) translateY(-10px);
        }

        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 999;
        }

        .sidebar-overlay.open {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body>
    <!-- HAMBURGER MENU -->
    <div class="hamburger" id="hamburgerBtn">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- SIDEBAR OVERLAY -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- SIDEBAR NAVIGATION -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">Menu</div>
            <button class="sidebar-close" id="sidebarCloseBtn">✕</button>
        </div>

        <div class="sidebar-account">
            <div class="account-label">Logged In As</div>
            <div class="account-name" id="adminUsername">Admin</div>
        </div>

        <nav class="sidebar-nav">
            <a href="/start-competition.html" class="sidebar-link">Current Dashboard</a>
            <a href="/competitions.html" class="sidebar-link active">All Competitions</a>
            <a href="/account-settings.html" class="sidebar-link">Admin Settings</a>
        </nav>

        <div class="sidebar-divider"></div>

        <div class="sidebar-logout">
            <button class="logout-btn" onclick="logoutAdmin()">Logout</button>
        </div>
    </div>

    <div class="container">
        <div class="page-header">
            <h1>Competitions</h1>
            <p>Manage and review all competitions</p>
        </div>

        <div id="competitionsList"></div>
    </div>

    <script>
        // SIDEBAR NAVIGATION
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const sidebarCloseBtn = document.getElementById('sidebarCloseBtn');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        hamburgerBtn.addEventListener('click', () => {
            sidebar.classList.toggle('open');
            sidebarOverlay.classList.toggle('open');
            hamburgerBtn.classList.toggle('open');
        });

        sidebarCloseBtn.addEventListener('click', closeSidebar);
        sidebarOverlay.addEventListener('click', closeSidebar);

        function closeSidebar() {
            sidebar.classList.remove('open');
            sidebarOverlay.classList.remove('open');
            hamburgerBtn.classList.remove('open');
        }

        // AUTHENTICATION
        async function checkAdminAuth() {
            const token = localStorage.getItem('adminToken');
            try {
                const response = await fetch('/api/admin/check-auth', {
                    headers: token ? { 'Authorization': `Bearer ${token}` } : {}
                });
                const data = await response.json();
                if (!data.authenticated) {
                    localStorage.removeItem('adminToken');
                    window.location.href = '/admin/setup';
                } else {
                    loadAdminInfo();
                    loadCompetitions();
                }
            } catch (error) {
                window.location.href = '/admin/setup';
            }
        }

        function loadAdminInfo() {
            const token = localStorage.getItem('adminToken');
            fetch('/api/admin/info', {
                headers: token ? { 'Authorization': `Bearer ${token}` } : {}
            })
            .then(r => r.json())
            .then(data => {
                if (data.username) {
                    document.getElementById('adminUsername').textContent = data.username;
                }
            })
            .catch(err => console.error('Error loading admin info:', err));
        }

        function logoutAdmin() {
            const token = localStorage.getItem('adminToken');
            fetch('/api/admin/logout', {
                method: 'POST',
                headers: token ? { 'Authorization': `Bearer ${token}` } : {}
            }).finally(() => {
                localStorage.removeItem('adminToken');
                localStorage.removeItem('activeSessionId');
                window.location.href = '/admin/setup';
            });
        }

        // LOAD COMPETITIONS
        async function loadCompetitions() {
            const token = localStorage.getItem('adminToken');
            try {
                const response = await fetch('/api/admin/competitions', {
                    headers: token ? { 'Authorization': `Bearer ${token}` } : {}
                });
                const data = await response.json();
                
                if (data.success && data.competitions && data.competitions.length > 0) {
                    renderCompetitions(data.competitions);
                } else {
                    document.getElementById('competitionsList').innerHTML = `
                        <div class="empty-state">
                            <p>No competitions yet</p>
                            <p style="font-size: 13px;">Start a new competition from the Control Panel</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading competitions:', error);
            }
        }

        function renderCompetitions(competitions) {
            const activeSessionId = localStorage.getItem('activeSessionId');
            
            const html = competitions.map(comp => {
                const date = new Date(comp.createdAt).toLocaleString();
                const isActive = comp.status === 'active';
                const isCurrentSession = comp.id === activeSessionId;
                const url = `${window.location.origin}/cyber_competition.html?session=${comp.id}`;
                
                // Add special styling for active session
                const cardClass = isCurrentSession ? ' style="border-color: var(--accent-green); background: rgba(0, 255, 136, 0.05);"' : '';
                const statusLabel = isCurrentSession ? `${comp.status} (Current)` : comp.status;
                
                return `
                    <div class="competition-card"${cardClass}>
                        <div class="comp-header">
                            <span class="comp-title">${comp.id}</span>
                            <span class="comp-status ${comp.status}">${statusLabel}</span>
                        </div>
                        
                        <div class="comp-info">
                            <div class="info-row">
                                <span class="info-label">Created:</span>
                                <span class="info-value">${date}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Teams:</span>
                                <span class="info-value">${Object.keys(comp.teams || {}).length}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Participant URL:</span>
                                <span class="info-value">${url}</span>
                            </div>
                        </div>
                        
                        <div class="comp-actions">
                            <button class="action-btn" onclick="copyToClipboard('${url}')">Copy URL</button>
                            <button class="action-btn" onclick="openDashboard('${comp.id}')">Dashboard</button>
                            <button class="action-btn" onclick="openReport('${comp.id}')">Report</button>
                            <button class="action-btn danger" onclick="deleteComp('${comp.id}')">Delete</button>
                        </div>
                    </div>
                `;
            }).join('');
            
            document.getElementById('competitionsList').innerHTML = `<div class="competitions-grid">${html}</div>`;
        }

        function copyToClipboard(url) {
            navigator.clipboard.writeText(url).then(() => {
                alert('URL copied to clipboard!');
            }).catch(() => {
                alert('Failed to copy URL');
            });
        }

        function openDashboard(sessionId) {
            // Save session to localStorage so it persists
            localStorage.setItem('activeSessionId', sessionId);
            window.open(`/control-panel.html`, '_blank');
        }

        function openReport(sessionId) {
            window.open(`/reports.html?session=${sessionId}`, '_blank');
        }

        function deleteComp(sessionId) {
            if (confirm('Permanently delete this competition and all its data?')) {
                const token = localStorage.getItem('adminToken');
                fetch(`/api/admin/delete-competition/${sessionId}`, {
                    method: 'DELETE',
                    headers: token ? { 'Authorization': `Bearer ${token}` } : {}
                })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        loadCompetitions();
                    } else {
                        alert('Failed to delete competition');
                    }
                });
            }
        }

        // Initialize
        checkAdminAuth();
    </script>
</body>
</html>
