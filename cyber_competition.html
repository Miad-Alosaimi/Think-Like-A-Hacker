<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Think like a hacker: Competition Platform</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-dark: #0a0e27;
            --primary-darker: #05070f;
            --accent-cyan: #00d9ff;
            --accent-purple: #6b5bff;
            --accent-green: #00ff88;
            --accent-red: #ff1744;
            --accent-orange: #ff6b35;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --shield-active: #00ff88;
            --breach-color: #ff1744;
            --grid-color: rgba(0, 217, 255, 0.05);
            --transition-fast: 0.2s ease;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary-darker) 0%, #0f1535 50%, #0a0e27 100%);
            color: var(--text-primary);
            overflow-x: hidden;
            background-attachment: fixed;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 2px, var(--grid-color) 2px, var(--grid-color) 4px),
                repeating-linear-gradient(90deg, transparent, transparent 2px, var(--grid-color) 2px, var(--grid-color) 4px);
            pointer-events: none;
            z-index: 0;
        }

        #app {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes glitch {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        @keyframes shieldPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes threatAlert {
            0% { transform: scaleY(1); }
            50% { transform: scaleY(1.1); }
            100% { transform: scaleY(1); }
        }

        .screen {
            display: none;
            animation: fadeIn 0.6s ease-out;
        }

        .screen.active {
            display: block;
        }

        /* ===== WELCOME SCREEN ===== */
        .welcome-screen {
            text-align: center;
        }

        .welcome-header {
            margin-bottom: 60px;
        }

        .shield-logo {
            font-size: 80px;
            margin-bottom: 20px;
            animation: shieldPulse 2s ease-in-out infinite;
        }

        .welcome-title {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .welcome-subtitle {
            font-size: 18px;
            color: var(--text-secondary);
            margin-bottom: 50px;
        }

        .welcome-content {
            background: rgba(10, 14, 39, 0.8);
            border: 2px solid var(--accent-cyan);
            border-radius: 10px;
            padding: 40px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(0, 217, 255, 0.2);
        }

        .welcome-text {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .input-group {
            margin-bottom: 30px;
        }

        .input-label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .input-field {
            width: 100%;
            max-width: 400px;
            padding: 15px 20px;
            background: rgba(0, 217, 255, 0.05);
            border: 2px solid var(--accent-cyan);
            border-radius: 5px;
            color: var(--text-primary);
            font-size: 16px;
            transition: all var(--transition-fast);
            margin: 0 auto;
            display: block;
        }

        .input-field:focus {
            outline: none;
            background: rgba(0, 217, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
        }

        .button {
            padding: 15px 40px;
            font-size: 16px;
            font-weight: 600;
            border: 2px solid var(--accent-green);
            background: transparent;
            color: var(--accent-green);
            border-radius: 5px;
            cursor: pointer;
            transition: all var(--transition-fast);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--accent-green);
            transition: left 0.3s ease;
            z-index: -1;
        }

        .button:hover {
            color: var(--primary-dark);
        }

        .button:hover::before {
            left: 0;
        }

        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== MISSION SCREEN ===== */
        .mission-screen {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 30px;
        }

        .mission-content {
            display: flex;
            flex-direction: column;
        }

        .mission-header {
            margin-bottom: 30px;
        }

        .mission-title {
            font-size: 32px;
            font-weight: 700;
            color: var(--accent-cyan);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .mission-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .mission-name-header {
            background: linear-gradient(135deg, rgba(107, 91, 255, 0.2) 0%, rgba(0, 217, 255, 0.1) 100%);
            border-left: 4px solid var(--accent-cyan);
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 6px;
            animation: fadeIn 0.6s ease-out;
        }

        .mission-number {
            font-size: 12px;
            color: var(--accent-purple);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .mission-name-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
        }

        .question-progress {
            font-size: 13px;
            color: var(--accent-green);
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            opacity: 0.9;
        }

        .question-card {
            background: rgba(10, 14, 39, 0.8);
            border: 1px solid var(--accent-purple);
            border-radius: 8px;
            padding: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(107, 91, 255, 0.1);
            margin-bottom: 20px;
            transition: all var(--transition-fast);
            flex-grow: 1;
        }

        .question-number {
            font-size: 12px;
            color: var(--accent-purple);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .question-text {
            font-size: 18px;
            color: var(--text-primary);
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .email-display {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--accent-cyan);
            border-radius: 5px;
            padding: 20px;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: var(--accent-green);
        }

        .email-header {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--accent-cyan);
        }

        .email-line {
            margin: 8px 0;
        }

        .email-label {
            color: var(--accent-cyan);
            font-weight: 600;
        }

        .email-content {
            color: var(--text-secondary);
            margin-top: 20px;
            line-height: 1.5;
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            padding: 15px 20px;
            background: rgba(0, 217, 255, 0.05);
            border: 2px solid var(--accent-cyan);
            border-radius: 5px;
            cursor: pointer;
            transition: all var(--transition-fast);
            text-align: left;
            font-size: 14px;
            color: var(--text-primary);
            position: relative;
            overflow: hidden;
        }

        .option:hover:not(.disabled) {
            background: rgba(0, 217, 255, 0.15);
            box-shadow: 0 0 15px rgba(0, 217, 255, 0.2);
        }

        .option.disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .option.correct {
            border-color: var(--accent-green);
            background: rgba(0, 255, 136, 0.1);
            color: var(--accent-green);
        }

        .option.incorrect {
            border-color: var(--accent-red);
            background: rgba(255, 23, 68, 0.1);
            color: var(--accent-red);
            animation: glitch 0.4s ease;
        }

        .option-indicator {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
        }

        .learning-tip {
            background: rgba(255, 107, 53, 0.1);
            border-left: 3px solid var(--accent-orange);
            padding: 15px;
            margin-top: 15px;
            border-radius: 3px;
            font-size: 13px;
            color: var(--accent-orange);
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }

        .feedback-message {
            padding: 15px;
            margin-top: 15px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: fadeIn 0.3s ease;
        }

        .feedback-success {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
        }

        .feedback-error {
            background: rgba(255, 23, 68, 0.1);
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
        }

        .next-button {
            margin-top: 20px;
            width: 100%;
            max-width: 300px;
            margin-left: auto;
            margin-right: auto;
            display: block;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .stats-card {
            background: rgba(10, 14, 39, 0.8);
            border: 1px solid var(--accent-cyan);
            border-radius: 8px;
            padding: 20px;
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent-cyan);
        }

        .shield-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 160px;
            margin: 20px 0;
        }

        .shield-visual {
            position: relative;
            width: 120px;
            height: 140px;
        }

        .shield-bg {
            width: 100%;
            height: 100%;
            background: rgba(0, 217, 255, 0.1);
            border: 2px solid var(--accent-cyan);
            border-radius: 10px 10px 0 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .shield-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(180deg, var(--accent-green), var(--accent-cyan));
            border-radius: 0 0 0 10px;
            transition: height 0.5s ease;
        }

        .shield-text {
            position: relative;
            z-index: 2;
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-cyan);
        }
        /* TOP PROGRESS PANEL */
        .top-progress-panel {
            background: linear-gradient(135deg, rgba(10, 14, 39, 0.95) 0%, rgba(107, 91, 255, 0.1) 100%);
            border: 2px solid var(--accent-cyan);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 217, 255, 0.2);
            animation: fadeIn 0.6s ease-out;
        }

        .progress-team-name {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent-cyan);
            margin-bottom: 16px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .progress-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
            min-height: 50px;
        }

        .progress-item-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 16px;
            background: rgba(0, 217, 255, 0.1);
            border-left: 3px solid var(--accent-cyan);
            border-radius: 6px;
            flex: 0 1 auto;
        }

        .progress-item-label {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            min-width: 50px;
        }

        .progress-item-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-green);
            letter-spacing: 0.5px;
        }

        .progress-shield-display {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 16px;
            background: rgba(0, 255, 136, 0.1);
            border-left: 3px solid var(--accent-green);
            border-radius: 6px;
        }

        .progress-shield-icon {
            font-size: 28px;
        }

        .progress-shield-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-green);
            min-width: 35px;
        }

        .progress-timer {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 16px;
            background: rgba(255, 107, 53, 0.1);
            border-left: 3px solid var(--accent-orange);
            border-radius: 6px;
            font-family: 'Courier New', monospace;
        }

        .progress-timer-icon {
            font-size: 20px;
        }

        .progress-timer-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-orange);
            letter-spacing: 1px;
            min-width: 70px;
        }

        .progress-timer.warning .progress-timer-value {
            color: var(--accent-red);
            animation: pulse 1s ease-in-out infinite;
        }

        /* IMPROVED NEXT BUTTON */
        .next-button {
            background: linear-gradient(135deg, var(--accent-green) 0%, #00dd7a 100%);
            border: none;
            color: var(--primary-dark);
            font-size: 16px;
            font-weight: 700;
            padding: 16px 40px;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(0, 255, 136, 0.4);
            min-width: 180px;
            position: relative;
            overflow: hidden;
        }

        .next-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.3s ease;
        }

        .next-button:hover::before {
            left: 100%;
        }

        .next-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(0, 255, 136, 0.6);
        }

        .next-button:active {
            transform: translateY(0);
        }

        /* Improved shield number visibility */
        .shield-text {
            font-size: 32px;
            font-weight: 900;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.8), 0 0 20px rgba(0, 217, 255, 0.4);
            z-index: 2;
            position: relative;
            letter-spacing: 1px;
        }


        .shield-breach {
            animation: threatAlert 0.5s ease;
        }

        .mission-progress {
            background: rgba(10, 14, 39, 0.8);
            border: 1px solid var(--accent-purple);
            border-radius: 8px;
            padding: 15px;
            backdrop-filter: blur(10px);
        }

        .progress-label {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .progress-item {
            padding: 8px;
            margin-bottom: 5px;
            border-radius: 3px;
            font-size: 12px;
            color: var(--text-secondary);
            border-left: 2px solid var(--text-secondary);
            padding-left: 12px;
            transition: all var(--transition-fast);
        }

        .progress-item.completed {
            color: var(--accent-green);
            border-left-color: var(--accent-green);
            background: rgba(0, 255, 136, 0.05);
        }

        .progress-item.current {
            color: var(--accent-cyan);
            border-left-color: var(--accent-cyan);
            background: rgba(0, 217, 255, 0.1);
        }

        /* ===== MISSION COMPLETE SCREEN ===== */
        .mission-complete-screen {
            text-align: center;
        }

        .mission-complete-box {
            background: rgba(10, 14, 39, 0.8);
            border: 2px solid var(--accent-green);
            border-radius: 10px;
            padding: 60px 40px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.2);
            animation: fadeIn 0.6s ease-out;
            margin: 40px 0;
        }

        .complete-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .complete-title {
            font-size: 36px;
            font-weight: 700;
            color: var(--accent-green);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .complete-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 30px 0;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .complete-stat {
            background: rgba(0, 217, 255, 0.05);
            border: 1px solid var(--accent-cyan);
            border-radius: 5px;
            padding: 15px;
        }

        .complete-stat-label {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .complete-stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-cyan);
        }

        .continue-button {
            margin-top: 30px;
            min-width: 200px;
        }

        /* ===== FINAL SCREEN ===== */
        .final-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .final-title {
            font-size: 56px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: fadeIn 0.8s ease-out;
        }

        .final-box {
            background: rgba(10, 14, 39, 0.8);
            border: 2px solid var(--accent-green);
            border-radius: 10px;
            padding: 50px 40px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 50px rgba(0, 255, 136, 0.25);
            margin: 30px 0;
            animation: fadeIn 0.8s ease-out 0.2s backwards;
        }

        .team-name {
            font-size: 24px;
            color: var(--accent-cyan);
            margin-bottom: 30px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .final-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .final-stat {
            background: rgba(0, 217, 255, 0.05);
            border: 1px solid var(--accent-cyan);
            border-radius: 8px;
            padding: 20px;
        }

        .final-stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .final-stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--accent-green);
        }

        .title-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
            color: var(--primary-dark);
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: 700;
            margin: 20px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: fadeIn 0.6s ease-out 0.4s backwards;
        }

        .final-message {
            font-size: 16px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin: 20px 0;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 800px) {
            .mission-screen {
                grid-template-columns: 1fr;
            }

            .sidebar {
                order: -1;
            }

            .welcome-title {
                font-size: 36px;
            }

            .final-title {
                font-size: 42px;
            }

            .complete-stats {
                grid-template-columns: 1fr;
            }

            .final-stats {
                grid-template-columns: 1fr;
            }
        }

        .drag-sort-item {
            background: rgba(0, 217, 255, 0.05);
            border: 2px solid var(--accent-cyan);
            border-radius: 5px;
            padding: 15px;
            margin: 10px 0;
            cursor: grab;
            transition: all var(--transition-fast);
            font-size: 14px;
            color: var(--text-primary);

                    return;
                }
                
                socket = io();
                socket.on('connect', () => {
                    console.log('Connected to server:', socket.id);
                    socketReady = true;
                    resolve();
                });
                socket.on('session-data', (data) => {

                        if (!app.timerStarted) {
                            app.timerStarted = true;
                            initializeTimer();
                        }
                    }
                });

                    if (timerInterval) clearInterval(timerInterval);

                socket.on('competition-resumed', (data) => {

                    // Adjust server start time based on pause duration
                    app.serverStartTime = data.startTime;
                    app.pausedElapsedTime = 0;
                    if (timerInterval) clearInterval(timerInterval);
                    initializeTimer();
                });
                socket.on('disconnect', () => {
                    console.log('Disconnected from server');
                    socketReady = false;
                });
            });

        function renderPasswordQuestion(question, isAnswered, userAnswer) {
            const validation = question.validation;
            let isValid = false;
            let errors = [];
            
            if (userAnswer) {
                if (userAnswer.length < validation.minLength) {
                    errors.push(`Minimum ${validation.minLength} characters required`);
                }
                if (validation.requireUppercase && !/[A-Z]/.test(userAnswer)) {
                    errors.push('Must include uppercase letters');
                }
                if (validation.requireLowercase && !/[a-z]/.test(userAnswer)) {
                    errors.push('Must include lowercase letters');
                }
                if (validation.requireNumber && !/[0-9]/.test(userAnswer)) {
                    errors.push('Must include at least one number');
                }
                if (validation.requireSymbol && !/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(userAnswer)) {
                    errors.push('Must include at least one symbol (!@#$%...)');
                }
                if (validation.forbiddenWords.some(word => userAnswer.toLowerCase().includes(word))) {
                    errors.push('Password contains forbidden words');
                }
                isValid = errors.length === 0;
            }
            
            return `

        function initializeTimer() {
            // Use server start time if available, otherwise local time
            timerStartTime = app.serverStartTime || Date.now();
            app.timerStarted = true;
            
            if (timerInterval) clearInterval(timerInterval);
            
            updateTimer(); // Update immediately
            
            timerInterval = setInterval(updateTimer, 100);
        }

        function updateTimer() {
            // Safety checks
            if (!app.serverStartTime && app.timerPaused === false) return;
            
            let elapsed;
            
            if (app.timerPaused) {
                // When paused, show the elapsed time at pause moment
                elapsed = app.pausedElapsedTime || 0;
            } else {
                // Calculate elapsed time from server start time
                elapsed = Date.now() - app.serverStartTime;
            }
            
            const remaining = Math.max(0, TIMER_DURATION - elapsed);
            
            const hours = Math.floor(remaining / (1000 * 60 * 60));
            const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((remaining % (1000 * 60)) / 1000);
            
            const timerValue = document.getElementById('timerValue');
            if (timerValue) {
                timerValue.textContent = `${hours}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            } else {
                console.warn('Timer element not found - will retry');
            }
            
            const timerDisplay = document.getElementById('timerDisplay');
            if (timerDisplay) {
                if (remaining <= 10 * 60 * 1000) { // 10 minutes or less
                    timerDisplay.classList.add('warning');
                } else {
                    timerDisplay.classList.remove('warning');
                }
            }
            
            if (remaining <= 0) {
                clearInterval(timerInterval);
                app.timerExpired = true;
                showTimerExpired();
            }
        }

        function checkAndEmitTeamFinished() {
            // Check if this was the last question of the last mission
            const currentMission = missions[app.currentMissionIndex];
            const isLastQuestionOfMission = app.currentQuestionIndex === currentMission.questions.length - 1;
            const isLastMission = app.currentMissionIndex === missions.length - 1;
            
            if (isLastQuestionOfMission && isLastMission) {
                // This was the final answer - team is finished!
                if (socket && app.sessionId && app.teamId) {
                    socket.emit('team-finished', {
                        sessionId: app.sessionId,
                        teamId: app.teamId,
                        finalScore: app.score,
                        finalShield: app.shield
                    });
                    console.log('Team finished competition!');
                }
            }
        }

        function renderMissionComplete() {
            const mission = missions[app.currentMissionIndex];

        function renderFinal() {
            const totalQuestions = missions.reduce((sum, m) => sum + m.questions.length, 0);

                // Find corresponding question

                    for (let q of m.questions) {

                    }

                return false;

            let title = 'Cyber Novice';
            if (app.score >= 1800) title = 'Cyber Elite';
            else if (app.score >= 1400) title = 'Security Guardian';
            else if (app.score >= 1000) title = 'Cyber Defender';
            else if (app.score >= 700) title = 'Threat Hunter';

            return `
                <div class="container">
                    <div class="screen active final-screen">
                        <h1 class="final-title">Mission Complete</h1>
                        <div class="final-box">
                            <div class="team-name">Team: ${app.teamName}</div>
                            <div class="final-stats">

                                    <div class="final-stat-value">${app.score}</div>
                                </div>
                                <div class="final-stat">
                                    <div class="final-stat-label">Cyber Shield</div>
                                    <div class="final-stat-value">${Math.round(app.shield)}%</div>

        function renderTimerExpired() {
            let title = 'Cyber Novice';
            if (app.score >= 1800) title = 'Cyber Elite';
            else if (app.score >= 1400) title = 'Security Guardian';
            else if (app.score >= 1000) title = 'Cyber Defender';
            else if (app.score >= 700) title = 'Threat Hunter';

            return `
                <div class="container">
                    <div class="screen active timer-expired-screen">
                        <div class="final-box" style="text-align: center;">
                            <div style="font-size: 64px; margin-bottom: 20px;">⏰</div>
                            <h1 style="color: var(--accent-orange); margin-bottom: 20px; font-size: 36px;">TIME'S UP!</h1>
                            <p style="font-size: 18px; color: var(--text-secondary); margin-bottom: 30px;">
                                Your 2-hour competition time has expired.
                            </p>
                            <div class="final-stats">
                                <div class="final-stat">
                                    <div class="final-stat-label">Final Score</div>
                                    <div class="final-stat-value">${app.score}</div>
                                </div>
                                <div class="final-stat">
                                    <div class="final-stat-label">Cyber Shield</div>
                                    <div class="final-stat-value">${Math.round(app.shield)}%</div>
                                </div>
                                <div class="final-stat">

        // ===== EVENT LISTENERS =====
        function attachEventListeners() {
            // Welcome screen
            const startBtn = document.getElementById('startButton');
            if (startBtn) {
                startBtn.onclick = async () => {
                    const teamName = document.getElementById('teamNameInput').value.trim();
                    if (!teamName) {
                        alert('Please enter a team name');
                        return;
                    }
                    app.teamName = teamName;
                    
                    // Get session ID from URL
                    const params = new URLSearchParams(window.location.search);
                    app.sessionId = params.get('session');
                    
                    // Initialize socket and wait for connection
                    await initializeSocket();
                    console.log('Socket ready, joining session:', app.sessionId);
                    
                    // Now join session via socket (socket is definitely connected!)
                    if (socket && socketReady && app.sessionId) {
                        app.teamId = 'team-' + Math.random().toString(36).substr(2, 9);
                        socket.emit('join-session', { 
                            sessionId: app.sessionId, 
                            teamName: app.teamName,
                            teamId: app.teamId,
                            isObserver: false
                        });
                        console.log('Team joined session:', app.sessionId, app.teamName);
                    } else {
                        console.error('Socket not ready or session ID missing');
                        alert('Connection error. Please refresh the page and try again.');
                        return;
                    }
                    
                    app.currentScreen = 'mission';
                    renderApp();
                };
                
                const input = document.getElementById('teamNameInput');
                if (input) {
                    input.onkeypress = (e) => {
                        if (e.key === 'Enter') startBtn.click();
                    };
                }
            }

            // Mission screen - option buttons
            const options = document.querySelectorAll('.option');
            options.forEach(opt => {
                opt.onclick = () => {
                    if (opt.classList.contains('disabled')) return;
                    const answer = opt.dataset.answer;
                    const questionId = `${missions[app.currentMissionIndex].id}-q${app.currentQuestionIndex + 1}`;
                    const question = missions[app.currentMissionIndex].questions[app.currentQuestionIndex];
                    
                    app.answers[questionId] = answer;
                    app.answeredQuestions.add(questionId);
                    
                    const isCorrect = answer === question.correctAnswer;
                    if (isCorrect) {
                        app.score += 25;
                    } else {
                        app.shield = Math.max(0, app.shield - 8);
                    }
                    
                    // Emit answer to server
                    if (socket && app.sessionId && app.teamId) {
                        socket.emit('answer-submitted', {
                            sessionId: app.sessionId,
                            teamId: app.teamId,
                            missionId: missions[app.currentMissionIndex].id,
                            questionId: questionId,
                            isCorrect: isCorrect,
                            score: app.score,
                            shield: app.shield
                        });
                    }
                    
                    // Check if team finished
                    checkAndEmitTeamFinished();
                    
                    renderApp();
                };
            });

            // Decode input
            const submitDecode = document.getElementById('submitDecodeButton');
            if (submitDecode) {
                submitDecode.onclick = () => {
                    const input = document.getElementById('decodeInput');
                    const answer = input.value.trim();
                    const questionId = `${missions[app.currentMissionIndex].id}-q${app.currentQuestionIndex + 1}`;
                    const question = missions[app.currentMissionIndex].questions[app.currentQuestionIndex];
                    
                    app.answers[questionId] = answer;
                    app.answeredQuestions.add(questionId);
                    
                    const isCorrect = answer.toLowerCase() === question.correctAnswer.toLowerCase();
                    if (isCorrect) {
                        app.score += 30;
                    } else {
                        app.shield = Math.max(0, app.shield - 5);
                    }
                    
                    // Emit answer to server
                    if (socket && app.sessionId && app.teamId) {
                        socket.emit('answer-submitted', {
                            sessionId: app.sessionId,
                            teamId: app.teamId,
                            missionId: missions[app.currentMissionIndex].id,
                            questionId: questionId,
                            isCorrect: isCorrect,
                            score: app.score,
                            shield: app.shield
                        });
                    }
                    
                    // Check if team finished
                    checkAndEmitTeamFinished();
                    
                    renderApp();
                };
            }

            // Timeline order
            const submitTimeline = document.getElementById('submitTimelineButton');
            if (submitTimeline) {
                submitTimeline.onclick = () => {
                    const items = Array.from(document.querySelectorAll('.drag-sort-item'));
                    const order = items.map((_, idx) => idx);
                    const questionId = `${missions[app.currentMissionIndex].id}-q${app.currentQuestionIndex + 1}`;
                    
                    app.answers[questionId] = order;
                    app.answeredQuestions.add(questionId);
                    
                    const question = missions[app.currentMissionIndex].questions[app.currentQuestionIndex];
                    const isCorrect = JSON.stringify(order) === JSON.stringify(question.items.map((_, i) => i));
                    if (isCorrect) {
                        app.score += 25;
                    } else {
                        app.shield = Math.max(0, app.shield - 8);
                    }
                    
                    // Emit answer to server
                    if (socket && app.sessionId && app.teamId) {
                        socket.emit('answer-submitted', {
                            sessionId: app.sessionId,
                            teamId: app.teamId,
                            missionId: missions[app.currentMissionIndex].id,
                            questionId: questionId,
                            isCorrect: isCorrect,
                            score: app.score,
                            shield: app.shield
                        });
                    }
                    
                    // Check if team finished
                    checkAndEmitTeamFinished();
                    
                    renderApp();
                };
            }

            // Password check
            const submitPassword = document.getElementById('submitPasswordButton');
            if (submitPassword) {
                submitPassword.onclick = () => {
                    const input = document.getElementById('passwordInput');
                    const password = input.value;
                    const questionId = `${missions[app.currentMissionIndex].id}-q${app.currentQuestionIndex + 1}`;
                    const question = missions[app.currentMissionIndex].questions[app.currentQuestionIndex];
                    
                    app.answers[questionId] = password;
                    app.answeredQuestions.add(questionId);
                    
                    const validation = question.validation;
                    const isValid = password.length >= validation.minLength &&
                        /[A-Z]/.test(password) &&
                        /[a-z]/.test(password) &&
                        /[0-9]/.test(password) &&
                        /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password) &&
                        !validation.forbiddenWords.some(word => password.toLowerCase().includes(word));
                    
                    if (isValid) {
                        app.score += 25;
                    } else {
                        app.shield = Math.max(0, app.shield - 10);
                    }
                    
                    // Emit answer to server
                    if (socket && app.sessionId && app.teamId) {
                        socket.emit('answer-submitted', {
                            sessionId: app.sessionId,
                            teamId: app.teamId,
                            missionId: missions[app.currentMissionIndex].id,
                            questionId: questionId,
                            isCorrect: isValid,
                            score: app.score,
                            shield: app.shield
                        });
                    }
                    
                    // Check if team finished
                    checkAndEmitTeamFinished();
                    
                    renderApp();
                };
            }

            // Website check
            const submitWebsite = document.getElementById('submitWebsiteButton');
            if (submitWebsite) {
                submitWebsite.onclick = () => {
                    const checkboxes = document.querySelectorAll('.checkbox-option.checked');
                    const selected = Array.from(checkboxes).map(cb => cb.dataset.website);
                    const questionId = `${missions[app.currentMissionIndex].id}-q${app.currentQuestionIndex + 1}`;
                    const question = missions[app.currentMissionIndex].questions[app.currentQuestionIndex];
                    
                    app.answers[questionId] = selected;
                    app.answeredQuestions.add(questionId);
                    
                    const phishing = question.websites.filter(w => !w.isReal).map(w => w.id);
                    const isCorrect = JSON.stringify(selected.sort()) === JSON.stringify(phishing.sort());
                    if (isCorrect) {
                        app.score += 15;
                    } else {
                        app.shield = Math.max(0, app.shield - 5);
                    }
                    
                    // Emit answer to server
                    if (socket && app.sessionId && app.teamId) {
                        socket.emit('answer-submitted', {
                            sessionId: app.sessionId,
                            teamId: app.teamId,
                            missionId: missions[app.currentMissionIndex].id,
                            questionId: questionId,
                            isCorrect: isCorrect,
                            score: app.score,
                            shield: app.shield
                        });
                    }
                    
                    // Check if team finished
                    checkAndEmitTeamFinished();
                    
                    renderApp();
                };
            }

            // Website checkbox toggle
            const checkboxes = document.querySelectorAll('.checkbox-option');
            checkboxes.forEach(cb => {
                cb.onclick = () => {
                    if (cb.classList.contains('disabled')) return;
                    cb.classList.toggle('checked');
                };
            });

            // CTF submit
            const submitCTF = document.getElementById('submitCTFButton');
            if (submitCTF) {
                submitCTF.onclick = () => {
                    const input = document.getElementById('ctfInput');
                    const answer = input.value.trim();
                    const questionId = `${missions[app.currentMissionIndex].id}-q${app.currentQuestionIndex + 1}`;
                    const question = missions[app.currentMissionIndex].questions[app.currentQuestionIndex];
                    
                    app.answers[questionId] = answer;
                    app.answeredQuestions.add(questionId);
                    
                    const isCorrect = answer.toLowerCase() === question.correctAnswer.toLowerCase();
                    if (isCorrect) {
                        app.score += 10;
                    } else {
                        app.shield = Math.max(0, app.shield - 5);
                    }
                    
                    // Emit answer to server
                    if (socket && app.sessionId && app.teamId) {
                        socket.emit('answer-submitted', {
                            sessionId: app.sessionId,
                            teamId: app.teamId,
                            missionId: missions[app.currentMissionIndex].id,
                            questionId: questionId,
                            isCorrect: isCorrect,
                            score: app.score,
                            shield: app.shield
                        });
                    }
                    
                    // Check if team finished
                    checkAndEmitTeamFinished();
                    
                    renderApp();
                };
            }

            // Next button
            const nextBtn = document.getElementById('nextButton');
            if (nextBtn) {
                nextBtn.onclick = () => {
                    const mission = missions[app.currentMissionIndex];
                    if (app.currentQuestionIndex < mission.questions.length - 1) {
                        app.currentQuestionIndex++;
                        renderApp();
                    } else {
                        // Mission complete
                        if (app.currentMissionIndex < missions.length - 1) {
                            app.currentScreen = 'mission-complete';
                        } else {
                            // Moving to final screen - team finished!
                            app.currentScreen = 'final';
                            checkAndEmitTeamFinished();
                        }
                        renderApp();
                    }
                };
            }

            // Continue button (mission complete)
            const continueBtn = document.getElementById('continueButton');
            if (continueBtn) {
                continueBtn.onclick = () => {
                    app.currentMissionIndex++;
                    app.currentQuestionIndex = 0;
                    app.currentScreen = 'mission';
                    
                    // Emit mission-changed to server
                    if (socket && app.sessionId && app.teamId) {
                        socket.emit('mission-changed', {
                            sessionId: app.sessionId,
                            teamId: app.teamId,
                            missionIndex: app.currentMissionIndex
                        });
                    }
                    
                    renderApp();
                };
            }
            
            // Finish button (final screen)
            const finishBtn = document.getElementById('finishButton');
            if (finishBtn) {
                finishBtn.onclick = () => {
                    // Emit team-finished to server
                    if (socket && app.sessionId && app.teamId) {
                        socket.emit('team-finished', {
                            sessionId: app.sessionId,
                            teamId: app.teamId,
                            finalScore: app.score,
                            finalShield: app.shield
                        });
                    }
                };
            }

            // Prevent back button
            window.history.pushState(null, '', window.location.href);
            window.onpopstate = () => {
                window.history.pushState(null, '', window.location.href);
            };
        }

        // Initialize
        renderApp();
    </script>
